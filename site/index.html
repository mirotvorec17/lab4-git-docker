<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список студентов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 40px;
            color: #1e293b;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }
        h1 { color: #2563eb; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        th { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Список студентов</h1>
        <p>Учебный проект по дисциплине DevOps инженерия.</p>
        <table>
            <tr><th>Имя</th><th>Группа</th></tr>
            <tr><td>Ivan Ivanov</td><td>IS-21</td></tr>
            <tr><td>Petr Petrov</td><td>IS-21</td></tr>
            <tr><td>Anna Petrova</td><td>IS-22</td></tr>
        </table>
    </div>
</body>
</html>
